<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE7DC"/>
      <stop offset="100%" stop-color="#DDD3C2"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36383B"/>
      <stop offset="100%" stop-color="#242628"/>
    </linearGradient>
    <linearGradient id="notebook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#EAE3D5"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B5237"/>
      <stop offset="100%" stop-color="#523320"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B78B43"/>
      <stop offset="50%" stop-color="#E6C885"/>
      <stop offset="100%" stop-color="#9A7130"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1E1A14" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1A14" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Subtle morning window light -->
  <polygon points="0,0 440,0 260,600 0,600" fill="#FFFFFF" opacity="0.16"/>
  <!-- Wool felt desk mat -->
  <rect x="75" y="105" width="650" height="410" rx="22" fill="url(#mat)" filter="url(#shadow)"/>
  <rect x="85" y="115" width="630" height="390" rx="16" fill="none" stroke="#4D5054" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Open A5 Notebook -->
  <g filter="url(#shadow)" transform="translate(135,155) rotate(-3)">
    <rect x="0" y="0" width="270" height="330" rx="12" fill="url(#notebook)"/>
    <rect x="0" y="0" width="22" height="330" rx="6" fill="#C9B99F"/>
    <!-- Grid lines -->
    <g stroke="#D9D1C3" stroke-width="1">
      <line x1="42" y1="45" x2="245" y2="45"/>
      <line x1="42" y1="75" x2="245" y2="75"/>
      <line x1="42" y1="105" x2="245" y2="105"/>
      <line x1="42" y1="135" x2="245" y2="135"/>
      <line x1="42" y1="165" x2="245" y2="165"/>
      <line x1="42" y1="195" x2="245" y2="195"/>
      <line x1="42" y1="225" x2="245" y2="225"/>
      <line x1="42" y1="255" x2="245" y2="255"/>
    </g>
    <!-- Elastic band -->
    <rect x="236" y="0" width="10" height="330" fill="#2A2B2E"/>
  </g>
  <!-- Walnut Pen Tray -->
  <g filter="url(#shadow)" transform="translate(455,155) rotate(2)">
    <rect x="0" y="0" width="215" height="105" rx="18" fill="url(#walnut)"/>
    <rect x="12" y="12" width="191" height="81" rx="12" fill="#462B1A"/>
    <!-- Brass Pen inside tray -->
    <g transform="translate(26,45)">
      <rect x="0" y="0" width="142" height="14" rx="7" fill="url(#brass)"/>
      <polygon points="142,2 162,7 142,12" fill="#D5B26B"/>
      <rect x="18" y="-3" width="38" height="4" rx="2" fill="#8E672A"/>
    </g>
  </g>
  <!-- Ceramic Espresso Cup -->
  <g filter="url(#softShadow)" transform="translate(560,340)">
    <circle cx="55" cy="55" r="52" fill="#F3EFE8"/>
    <circle cx="55" cy="55" r="40" fill="#3D2618"/>
    <ellipse cx="44" cy="44" rx="14" ry="8" fill="#6D4730" opacity="0.55"/>
    <rect x="98" y="45" width="24" height="20" rx="10" fill="none" stroke="#F3EFE8" stroke-width="9"/>
  </g>
  <!-- Sticky tabs accent -->
  <g filter="url(#softShadow)" transform="translate(455,305) rotate(-5)">
    <rect x="0" y="0" width="76" height="32" rx="4" fill="#9BB39F"/>
    <rect x="0" y="38" width="76" height="32" rx="4" fill="#D6947A"/>
    <rect x="0" y="76" width="76" height="32" rx="4" fill="#DFC79C"/>
  </g>
</svg>
